name: Chromatic

on:
  pull_request:
    branches: [main, dev]
    paths:
      - 'packages/ui/**'
      - 'packages/tokens/**'

concurrency:
  group: chromatic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CHROMATIC_PROJECT_TOKEN 시크릿이 등록되기 전에는 Visual Testing 잡을 건너뛴다.
  # (시크릿 값은 노출하지 않고 존재 여부만 boolean으로 전달)
  guard:
    name: Token guard
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: echo "enabled=${{ secrets.CHROMATIC_PROJECT_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  chromatic:
    name: Visual Testing
    needs: guard
    if: needs.guard.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # pnpm 버전은 루트 package.json의 packageManager 필드를 단일 출처로 사용한다.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build tokens
        run: pnpm turbo build --filter=@daengdaeng/tokens

      - name: Run Chromatic
        uses: chromaui/action@v11
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: packages/ui
          buildScriptName: storybook:build
          exitOnceUploaded: true
          onlyChanged: true
